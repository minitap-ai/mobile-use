name: iOS Simulator Tests 📱

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-tests:
    runs-on: macos-14  # macos-14 includes Xcode 15+ with iOS 17 simulators
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List available simulators
        run: make simulator-list

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Create and boot iOS Simulator
        run: |
          # Create a new iOS 17.2 simulator for CI
          UDID=$(xcrun simctl create "CI-iPhone-15" "iPhone 15" "iOS17.2")
          echo "Created simulator with UDID: $UDID"
          
          # Boot the simulator
          xcrun simctl boot $UDID
          xcrun simctl bootstatus $UDID -b
          echo "Simulator booted successfully"
          
          # Save UDID for make test-ios
          echo "$UDID" > .ios_udid
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Install Homebrew dependencies
        run: |
          brew tap facebook/fb
          # idb 1.5 requires macOS 15 and Xcode 26; macos-14 runners need v1.1.8.
          git -C "$(brew --repository facebook/fb)" checkout --detach c0386793f59da10c619787f2aa18d938ef1d69c9
          brew trust --tap facebook/fb
          HOMEBREW_NO_AUTO_UPDATE=1 brew install idb-companion

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: make install

      - name: Run iOS simulator tests
        run: make test-ios

      - name: Cleanup
        if: always()
        run: |
          # Shutdown and delete CI simulator
          make simulator-down
          if [ -n "$SIMULATOR_UDID" ]; then
            xcrun simctl delete $SIMULATOR_UDID || true
          fi
